name: Assign PR author

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  assign-author:
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Metadata only: never check out or execute PR code in this workflow.
      - uses: actions/github-script@v9
        with:
          script: |
            try {
              await github.rest.issues.addAssignees({
                ...context.repo,
                issue_number: context.payload.pull_request.number,
                assignees: [context.payload.pull_request.user.login],
              });
            } catch (error) {
              if (error.status !== 422) throw error;
              core.notice('GitHub could not assign this PR author; leaving the PR unassigned.');
            }
